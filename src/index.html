<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="description" content="Explore delicious food, rolls, biryani, snacks, dosa, sweets and refreshing drinks from The Bite Zone Bidar. Browse the menu and order through WhatsApp.">

  <meta property="og:description" content="Good Food... Good Mood... Order authentic Biryani, Rolls, Snacks, Dosa, Sweets & Drinks delivered in Bidar.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?q=80&w=1200&auto=format&fit=crop">

  <!-- Fonts: Inter & Plus Jakarta Sans -->

<body>
  <app-root></app-root>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('TBZB ServiceWorker registered:', reg.scope))
          .catch((err) => console.warn('TBZB ServiceWorker registration failed:', err));
      });
    }
  </script>
</body>
