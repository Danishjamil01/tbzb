<!-- ======================================================= -->
<!-- DUAL MODULE ARCHITECTURE (SCREEN ADAPTIVE)              -->
<!-- Big Screen (> 768px): WEBSITE MODULE                    -->
<!-- Small Screen (<= 768px) & Mobile App: CUSTOMER MODULE   -->
<!-- ======================================================= -->
@if (platformService.isMobileScreen()) {
  <!-- 1. CUSTOMER MODULE (Mobile Phones & Android App) -->
  <app-customer (openHoursModal)="openHoursModal()"></app-customer>
} @else {
  <!-- 2. WEBSITE MODULE (Desktop, Laptops & Tablets) -->
  <app-website (openHoursModal)="openHoursModal()"></app-website>
}

<!-- ======================================================= -->
<!-- SHARED MODALS & OVERLAYS (Accessible by both modules)    -->
<!-- ======================================================= -->
<app-cart-drawer></app-cart-drawer>
<app-food-modal></app-food-modal>
<app-checkout-modal></app-checkout-modal>
<app-order-confirmation-modal></app-order-confirmation-modal>
<app-hours-modal></app-hours-modal>
<app-toast-container></app-toast-container>
<app-all-dishes></app-all-dishes>
<app-admin></app-admin>
