@if (isVisible()) {
  <div
    class="tbzb-splash"
    [class.fade-exit]="isFadingOut()"
    (click)="dismiss()"
    role="dialog"
    aria-label="The Bite Zone Bidar"
  >
    <!-- 1. Center Brand Logo Section -->
    <div class="splash-center-wrap">
      <img
        src="images/splash-tbzb-logo.png"
        alt="TBZB - The Bite Zone Bidar"
        class="brand-logo-img"
      />
    </div>

    <!-- 2. Bottom Section: Minimalist Circular Red Loader & Status Text -->
    <div class="splash-bottom-wrap">
      <div class="circular-spinner-box">
        <svg class="circular-loader" viewBox="0 0 50 50">
          <circle class="loader-track" cx="25" cy="25" r="20" fill="none" stroke-width="4.5"/>
          <circle class="loader-arc" cx="25" cy="25" r="20" fill="none" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="loading-status-text">Loading your food experience...</p>
    </div>
  </div>
}
